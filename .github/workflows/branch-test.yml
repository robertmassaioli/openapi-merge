name: Branch Lint and Test
on:
  push:
    branches-ignore:
      - main # Change this to your default branch
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
    - run: bun run lint
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
    # `bun test` transpiles rather than typechecks and eslint does not do full
    # type analysis, so this is the only job that catches a type error --
    # including one in a test file.
    - run: bun run build
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
    # Each package's `test` script is `bun test --coverage`, and its bunfig.toml
    # sets per-file coverageThreshold values, so a coverage regression fails
    # this step. The steps below only surface the numbers.
    - run: bun run test
    - name: Coverage summary
      if: always()
      run: bun scripts/coverage-summary.ts
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: packages/*/coverage/lcov.info
        if-no-files-found: error
