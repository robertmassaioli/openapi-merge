name: Branch Lint and Test
on:
  push:
    branches-ignore:
      - main # Change this to your default branch
jobs:
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
    # `bun run lint` is eslint followed by `bun run typecheck` (tsgo --noEmit).
    # ESLint does no full type analysis and `bun test` transpiles rather than
    # typechecks, so the typecheck half is what catches a type error -- including
    # one in a test file, which nothing used to catch.
    - run: bun run lint
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
    # Distinct from the typecheck above: this one actually emits, so it also
    # covers declaration output and anything that only breaks when writing dist/.
    - run: bun run build
  node-compat:
    name: Node ${{ matrix.node }} runs the published artifacts
    runs-on: ubuntu-latest
    strategy:
      # Report every broken version, not just the first one to fail.
      fail-fast: false
      matrix:
        # Every Node major inside the declared `engines: { node: ">=18" }` range,
        # plus the current release. 18 is the floor and the important one: it was
        # completely broken by commander@15 until the CLI became a bundle, and it
        # is the only entry that actually tests the promise we publish.
        node: ['18', '20', '22', '24']
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Set up Node ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
    - run: bun install --frozen-lockfile
    # Built by Bun, then exercised by Node -- which is the entire point. The
    # script packs both packages with npm, installs the tarballs with npm into a
    # directory outside the workspace, and drives the installed binary.
    #
    # `bun` is in RUNTIMES on every matrix entry. That repeats the Bun pass four
    # times, which costs a few seconds and means any single green job proves the
    # artifact under both runtimes.
    - run: ./scripts/verify-node-runtime.sh
      env:
        RUNTIMES: node bun

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
    # Each package's `test` script is `bun test --coverage`, and its bunfig.toml
    # sets per-file coverageThreshold values, so a coverage regression fails
    # this step. The steps below only surface the numbers.
    - run: bun run test
    - name: Coverage summary
      if: always()
      run: bun scripts/coverage-summary.ts
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-lcov
        path: packages/*/coverage/lcov.info
        if-no-files-found: error
