[test]
root = "src"

# Force every loadable source module into the coverage report. Without this,
# Bun omits never-imported files entirely and the total is measured over
# whichever files the tests happened to touch. See the file itself for why
# cli.ts and fix-schema.ts are not in it.
preload = ["./src/__tests__/_coverage-preload.ts"]

# `**/__tests__/**` also covers the preload module above, which would otherwise
# appear at 100% and inflate the total.
# `**/dist/**` keeps the sibling library's compiled output (imported via the
# workspace-linked `openapi-merge` package) out of this package's report.
coveragePathIgnorePatterns = ["**/__tests__/**", "**/dist/**"]

coverageReporter = ["text", "lcov"]

# Per-file floors, NOT a package average -- Bun enforces coverageThreshold
# against every file individually, so these are capped by the weakest file.
# Every source file now reaches 100% functions; the weakest lines figure is
# formatting.ts at 88.89%, whose only uncovered line is a statically unreachable
# defensive return.
#
# Both keys are mandatory: omitting one makes the omitted metric default to 100%
# and the run fails unconditionally. A misspelled key (`line`/`function`)
# silently disables the threshold instead. Both failure modes are silent, so
# verify any change in both directions -- set it high, confirm red; set it to the
# real value, confirm green.
coverageThreshold = { lines = 0.85, functions = 0.95 }
